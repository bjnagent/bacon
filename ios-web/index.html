<title>Bacon</title>
<!--
  The bundled start page. The app normally never shows it: capacitor.config.ts
  sets server.url, so the shell loads the live site. If a build is ever made
  without a server URL, this hands straight over to the offline screen, which
  connects to the live site as soon as it can.
-->
<meta http-equiv="refresh" content="0; url=offline.html?boot=1">
<style>html,body{margin:0;height:100%;background:#F6F4EF}@media (prefers-color-scheme:dark){html,body{background:#0E0D0B}}</style>
</head>
