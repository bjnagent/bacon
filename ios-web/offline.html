<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bacon — offline</title>
<!--
  Bundled inside the iOS app (capacitor.config.ts → server.errorPath). The
  native shell shows this page whenever the live site can't be reached, so it
  must work with zero network: no external fonts, scripts or images.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #F6F4EF; --surface: #FFFFFF; --text: #1B1712; --text-2: #5C5348; --text-3: #736A5E;
    --accent: #CC3F0E; --accent-press: #B1360B; --on-accent: #FFFFFF;
    --border: rgba(27, 23, 18, 0.09); --shadow: 0 4px 16px rgba(27, 23, 18, 0.08), 0 1px 3px rgba(27, 23, 18, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E0D0B; --surface: #191714; --text: #F3EFE8; --text-2: #B3AA9D; --text-3: #8D8478;
      --accent: #FF6B3D; --accent-press: #F05A2B; --on-accent: #1B1712;
      --border: rgba(243, 239, 232, 0.08); --shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  main {
    min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-right, 0px) + 16px)
             calc(env(safe-area-inset-bottom, 0px) + 24px) calc(env(safe-area-inset-left, 0px) + 16px);
  }
  .card { width: min(380px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  .mark { width: 72px; height: 72px; margin-bottom: 8px; }
  .mark svg { width: 100%; height: 100%; display: block; }
  h1 {
    margin: 0; font: 700 24px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    letter-spacing: -0.02em;
  }
  p { margin: 0; color: var(--text-2); }
  .actions { margin-top: 12px; width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  button {
    appearance: none; border: 0; cursor: pointer; font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1;
    min-height: 50px; width: 100%; max-width: 280px; border-radius: 14px;
    background: var(--accent); color: var(--on-accent);
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1), background 120ms;
  }
  button:active { transform: scale(0.98); background: var(--accent-press); }
  button[disabled] { opacity: 0.7; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .spin {
    width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
    animation: spin 0.8s linear infinite; display: none;
  }
  button[aria-busy="true"] .spin { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { min-height: 1.5em; font-size: 13px; color: var(--text-3); }
  .note { margin-top: 20px; font-size: 12px; color: var(--text-3); letter-spacing: 0.02em; }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } button { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <!-- The Bacon mark (components/BaconMark.tsx). -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="rotate(-12 32 36)">
          <path d="M8 25 C 18 19, 25 31, 33 25 C 41 19, 48 31, 56 25" stroke="#4A2016" stroke-opacity="0.5" stroke-width="11.8" stroke-linecap="round"/>
          <path d="M8 30.5 C 18 24.5, 25 36.5, 33 30.5 C 41 24.5, 48 36.5, 56 30.5" stroke="#4A2016" stroke-opacity="0.5" stroke-width="11.8" stroke-linecap="round"/>
          <path d="M8 36 C 18 30, 25 42, 33 36 C 41 30, 48 42, 56 36" stroke="#4A2016" stroke-opacity="0.5" stroke-width="11.8" stroke-linecap="round"/>
          <path d="M8 41.5 C 18 35.5, 25 47.5, 33 41.5 C 41 35.5, 48 47.5, 56 41.5" stroke="#4A2016" stroke-opacity="0.5" stroke-width="11.8" stroke-linecap="round"/>
          <path d="M8 47 C 18 41, 25 53, 33 47 C 41 41, 48 53, 56 47" stroke="#4A2016" stroke-opacity="0.5" stroke-width="11.8" stroke-linecap="round"/>
          <path d="M8 25 C 18 19, 25 31, 33 25 C 41 19, 48 31, 56 25" stroke="#F0D8B4" stroke-width="9.4" stroke-linecap="round"/>
          <path d="M8 30.5 C 18 24.5, 25 36.5, 33 30.5 C 41 24.5, 48 36.5, 56 30.5" stroke="#C0473A" stroke-width="9.4" stroke-linecap="round"/>
          <path d="M8 36 C 18 30, 25 42, 33 36 C 41 30, 48 42, 56 36" stroke="#D98771" stroke-width="9.4" stroke-linecap="round"/>
          <path d="M8 41.5 C 18 35.5, 25 47.5, 33 41.5 C 41 35.5, 48 47.5, 56 41.5" stroke="#C0473A" stroke-width="9.4" stroke-linecap="round"/>
          <path d="M8 47 C 18 41, 25 53, 33 47 C 41 41, 48 53, 56 47" stroke="#E9C99C" stroke-width="9.4" stroke-linecap="round"/>
          <path d="M8 24.2 C 18 18.2, 25 30.2, 33 24.2 C 41 18.2, 48 30.2, 56 24.2" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g transform="rotate(11 30 34)">
          <circle cx="25" cy="33" r="2.6" fill="#3A1E14"/><circle cx="35" cy="33" r="2.6" fill="#3A1E14"/>
          <circle cx="24.1" cy="32.1" r="0.9" fill="#fff"/><circle cx="34.1" cy="32.1" r="0.9" fill="#fff"/>
          <path d="M26 38 Q30 41.5 34 38" stroke="#3A1E14" stroke-width="1.7" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <h1>Off the air</h1>
    <p>Bacon can't reach the desk right now. It never shows yesterday's numbers as if they were live, so it waits for a connection.</p>
    <div class="actions">
      <button id="retry" type="button"><span class="spin" aria-hidden="true"></span><span id="retry-label">Try again</span></button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>
    <p class="note">Research, not advice · Verify before you act</p>
  </div>
</main>
<script>
  (function () {
    // Injected at document start by the native shell (ios/App/App/BaconBridgeViewController.swift).
    var info = window.BaconNative || {};
    var SERVER = String(info.serverUrl || "https://bacon-flax.vercel.app").replace(/\/+$/, "");
    var cap = window.Capacitor || {};
    var plugins = cap.Plugins || {};
    var button = document.getElementById("retry");
    var label = document.getElementById("retry-label");
    var status = document.getElementById("status");
    var busy = false;

    function call(name, method, opts) {
      try {
        var p = plugins[name];
        if (p && typeof p[method] === "function") return Promise.resolve(p[method](opts || {})).catch(function () {});
      } catch (e) { /* native polish is optional */ }
      return Promise.resolve();
    }

    // The web app never loaded, so nothing else will lift the launch screen.
    call("SplashScreen", "hide", { fadeOutDuration: 200 });
    call("StatusBar", "setStyle", { style: "DEFAULT" });

    // Reachability: an opaque no-cors GET of the health endpoint. Any HTTP
    // answer means the network and the server are back; only a network error rejects.
    function reachable(timeoutMs) {
      return new Promise(function (resolve) {
        var done = false;
        var t = setTimeout(function () { if (!done) { done = true; resolve(false); } }, timeoutMs);
        fetch(SERVER + "/api/health?ping=" + Date.now(), { mode: "no-cors", cache: "no-store" })
          .then(function () { if (!done) { done = true; clearTimeout(t); resolve(true); } })
          .catch(function () { if (!done) { done = true; clearTimeout(t); resolve(false); } });
      });
    }

    function retry(auto) {
      if (busy) return;
      busy = true;
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
      label.textContent = "Connecting…";
      status.textContent = "";
      if (!auto) call("Haptics", "impact", { style: "LIGHT" });
      reachable(8000).then(function (ok) {
        if (ok) {
          label.textContent = "Opening Bacon…";
          window.location.replace(SERVER + "/");
          return;
        }
        busy = false;
        button.disabled = false;
        button.removeAttribute("aria-busy");
        label.textContent = "Try again";
        status.textContent = navigator.onLine === false ? "Your device is offline." : "Still can't reach Bacon. Check your connection.";
        if (!auto) call("Haptics", "notification", { type: "WARNING" });
      });
    }

    button.addEventListener("click", function () { retry(false); });
    // Come back on our own as soon as the device does.
    window.addEventListener("online", function () { retry(true); });
    // Opened as the start page (index.html → ?boot=1) rather than after a
    // failure: try the live site straight away.
    if (/[?&]boot=1/.test(window.location.search)) retry(true);
    try {
      if (plugins.App && typeof plugins.App.addListener === "function") {
        plugins.App.addListener("resume", function () { retry(true); });
      }
    } catch (e) { /* ignore */ }
  })();
</script>
</body>
</html>
